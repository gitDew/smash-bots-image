name: Release event images
on:
  push:
    tags: ['v*']

# Publishing is a deliberate version-tag operation, never a PR or branch push.
concurrency:
  group: event-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      - name: Validate version and ensure it is a new release
        id: meta
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a version tag such as v0.1.0.'; exit 1; }
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This release already exists. Publish a new version instead of replacing it.'
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  tested-images:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and test (no event secrets)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -m pip install --require-hashes -r validator/requirements.txt
          npm test
          python3 -B -m unittest discover -s tests -p 'test_*.py'
      - uses: docker/setup-buildx-action@v3
      - name: Build Pi UI for the native architecture
        uses: docker/build-push-action@v6
        with:
          context: .
          target: agent
          platforms: ${{ matrix.platform }}
          load: true
          tags: smash-bots:agent-dev
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
      - name: Build broker for the native architecture
        uses: docker/build-push-action@v6
        with:
          context: .
          target: broker
          platforms: ${{ matrix.platform }}
          load: true
          tags: smash-bots:broker-dev
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
      - name: Build validator for the native architecture
        uses: docker/build-push-action@v6
        with:
          context: .
          target: validator
          platforms: ${{ matrix.platform }}
          load: true
          tags: smash-bots:validator-dev
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
      - name: Test the actual images before publication
        run: make smoke
      - name: Log in to GHCR using this workflow's token only
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested images and record their digests
        env:
          PREFIX: ${{ needs.prepare.outputs.prefix }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          for service in agent broker validator; do
            ref="$PREFIX:$service-$VERSION-$ARCH"
            docker tag "smash-bots:$service-dev" "$ref"
            docker push "$ref"
          done
          node scripts/release-metadata.mjs architecture --prefix "$PREFIX" --version "$VERSION" --arch "$ARCH" --commit "$(git rev-parse HEAD)" --output "release-out/$ARCH.json"
      - uses: actions/upload-artifact@v4
        with:
          name: image-digests-${{ matrix.arch }}
          path: release-out/${{ matrix.arch }}.json
          retention-days: 7

  manifests:
    needs: [prepare, tested-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digests-*
          path: release-out
          merge-multiple: true
      - name: Join tested architectures into digest-pinned event images
        run: node scripts/release-metadata.mjs merge --amd64 release-out/amd64.json --arm64 release-out/arm64.json --output release.json
      - name: Publish public metadata only (never team bundles or tokens)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" release.json --verify-tag --title "Smash Bots $VERSION" --notes 'Tested Linux amd64 + arm64 images. Download release.json and generate private team bundles locally. Mark the GHCR package public for anonymous laptop pulls. No event credentials are included in this release.'
