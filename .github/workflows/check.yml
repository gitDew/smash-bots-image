name: Check team agent
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-launcher-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse the manual Windows launcher without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/templates/launch.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw 'The Windows launcher did not parse.' }

  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -m pip install --require-hashes -r validator/requirements.txt
      - name: Unit and protocol tests (no live credentials)
        run: |
          npm test
          python3 -B -m unittest discover -s tests -p 'test_*.py'
          ENV_FILE=.env.example docker compose --env-file .env.example config --quiet
      - name: Build the UI, broker, and validator images
        run: make build
      - name: Test actual container isolation and verification
        run: make smoke
